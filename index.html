<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type Scale Studio</title><style>:root{font-family:Georgia,serif;color:#18243a;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}.top{display:flex;justify-content:space-between;border-bottom:1px solid #c8d0c4;padding:18px 24px;font:700 13px system-ui;letter-spacing:.12em}.wrap{max-width:1100px;margin:auto;padding:36px 24px}.hero{padding:54px 0 30px;max-width:700px}.hero small{font:800 11px system-ui;color:#77854a;letter-spacing:.2em}.hero h1{font-size:clamp(3rem,7vw,6rem);line-height:.92;letter-spacing:-.07em;margin:16px 0}.hero p{font:18px/1.6 system-ui;color:#526078}.panel{display:grid;grid-template-columns:280px 1fr;background:#fff;border:1px solid #c8d0c4}.controls{padding:24px;background:#e9eee4}.controls label{display:block;font:700 13px system-ui;margin:18px 0}.controls input{display:block;width:100%;margin-top:8px;padding:11px;border:1px solid #b8c4b2;background:white;font:16px system-ui}.controls button{width:100%;padding:13px;background:#243c5a;color:white;border:0;font-weight:700;cursor:pointer}.specimen{padding:30px;overflow:hidden}.specimen h2{font-size:2.4rem;margin:0 0 12px}.specimen p{font:1rem/1.6 system-ui}.scale{display:grid;gap:10px;margin-top:30px}.item{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;border-top:1px solid #e3e6df;padding:10px 0;font:12px system-ui}.item b{font:inherit;color:#77854a}.item strong{font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item code{color:#758071;text-align:right}.out{white-space:pre-wrap;background:#17263b;color:#dce9b4;padding:16px;font:12px/1.6 ui-monospace;max-height:170px;overflow:auto}@media(max-width:720px){.panel{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls label{margin:4px 0}.controls button{grid-column:1/-1}}</style></head><body><header class="top"><span>TYPE / SYSTEMS</span><span>STUDIO 01</span></header><main class="wrap"><section class="hero"><small>LET THE SCALE DO THE WORK</small><h1>Make every<br>size belong.</h1><p>Set a base, choose a ratio, and see the whole typographic family fall into place.</p></section><section class="panel"><aside class="controls"><label>Base size (px)<input id="base" type="number" min="8" max="100" value="16"></label><label>Scale ratio<input id="ratio" type="number" min="1.05" max="2.5" step=".01" value="1.25"></label><label>Number of steps<input id="count" type="number" min="3" max="12" value="7"></label><button id="copy">Copy CSS tokens</button></aside><div class="specimen"><h2>One voice, many sizes.</h2><p>A useful type system gives every level a clear job while keeping the whole page in tune.</p><div id="scale" class="scale"></div><pre id="tokens" class="out" aria-live="polite"></pre></div></section></main><script type="module" src="app.mjs"></script></body></html>
